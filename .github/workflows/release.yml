name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Check release version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('manifest.json', 'utf8'));
          assert.match(manifest.version, /^\d+\.\d+\.\d+$/);
          assert.equal(process.env.GITHUB_REF_NAME, manifest.version, 'Tag must match manifest version without a v prefix');
          JS

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run build

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Mermaid Pilot $GITHUB_REF_NAME" \
            --generate-notes \
            --latest
